allowBuilds:
  esbuild: true
  node-pty: true
  sharp: true
# SDK 1.16.0 lists `@tobilu/qmd` (local search store) as an optional dependency; darwin never
# imports it and it drags in native builds (better-sqlite3, node-llama-cpp, tree-sitter-*).
ignoredOptionalDependencies:
  - '@tobilu/qmd'
patchedDependencies:
  '@strands-agents/sdk@1.16.0': patches/@strands-agents__sdk@1.16.0.patch
